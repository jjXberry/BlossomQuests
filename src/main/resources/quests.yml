# ============================================
#   ❀ BlossomQuests - quests.yml ❀
# ============================================
# Every player gets 3 random DAILY quests each day and 3 random WEEKLY quests each Monday
# (change how many in config.yml). Add, remove or change quests here, then /bq reload.
#
# type:   MINE, PLACE, KILL, KILL_PLAYER, FISH, CRAFT, BREED, PLAYTIME (minutes), BOSS (Sakura Warden)
#         From BlossomBiomes: DISCOVER (target: a biome like MOONLIGHT_GARDEN), GATHER (target: a material
#         like SAKURA_PETAL), BIOME_BOSS (target: RONIN, BRAMBLEHORN, MOON_SORCERESS, EMERALD_WARLORD, FROSTMAW)
# target: ANY, a list of blocks/items/mobs like [DIAMOND_ORE, DEEPSLATE_DIAMOND_ORE],
#         or HOSTILE for any hostile mob (KILL only)
# description: (optional) your own text. Without it, one is made for you ("Mine 5 Diamond Ore").
# rewards: money, petals, points (Blossom Points), items: ["sigil:1", "reaper:1", "DIAMOND:5"],
#          commands: ["say %player% is awesome"]
#
# Blocks players placed themselves don't count for MINE quests.

# Don't change this line: it's how new default quests get added to your file after updates.
defaults-version: 2

