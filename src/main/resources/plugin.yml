name: BlossomQuests
version: 1.1.0
main: com.blossomsmp.quests.BlossomQuests
api-version: '1.21'
author: BlossomSMP
description: Daily and weekly quests, achievements, a player Quest Board, bosses and legendary weapons. Counts Blossom biome progress too.
softdepend: [Vault, PlaceholderAPI, BlossomEconomy, BlossomCore, BlossomToggles, BlossomSettings]

commands:
  quest:
    description: Open the quest menu
    aliases: [quests]
    usage: /quest
  bq:
    description: BlossomQuests staff commands
    aliases: [blossomquests]
    usage: /bq

permissions:
  blossomquests.admin:
    description: Staff commands (/bq) and removing other players' board requests
    default: op
